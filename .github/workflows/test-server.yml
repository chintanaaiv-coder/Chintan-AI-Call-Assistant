name: Test Chintan server

on:
  push:
    paths: ["server/**", ".github/workflows/test-server.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: CHINTAN_NO_AUTOAPP=1 python -m pytest -q
