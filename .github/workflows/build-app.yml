name: Build Chintan app (Android APK + iPhone web app)

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android, iOS and web projects
        run: flutter create --org com.chintanai --project-name chintan_assistant --platforms android,ios,web .
      - name: Add Chintan's call screening
        run: python3 tool/patch_android.py
      - run: flutter pub get
      - name: App icon
        run: dart run flutter_launcher_icons
      - name: Name the web app
        run: python3 tool/patch_web.py
      - name: Check the code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Build APK
        run: flutter build apk --release
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/Chintan-AI-Call-Assistant.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Chintan-AI-Call-Assistant-apk
          path: app/build/Chintan-AI-Call-Assistant.apk
      - name: Publish as the "latest" download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk build/Chintan-AI-Call-Assistant.apk \
            --title "Chintan AI Call Assistant (latest Android build)" \
            --notes "Built from ${GITHUB_SHA::7}. Open this page on your Android phone and tap the .apk to install." \
            --latest
      - name: Build iPhone web app
        run: flutter build web --release --base-href /Chintan-AI-Call-Assistant/iphone/
      - name: Publish iPhone web app to GitHub Pages (iphone/ folder)
        working-directory: .
        run: |
          rm -rf iphone
          cp -r app/build/web iphone
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iphone .nojekyll
          git commit -m "Update iPhone web app (${GITHUB_SHA::7})" || exit 0
          git pull --rebase --autostash origin main
          git push origin HEAD:main
