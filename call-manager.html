<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Call Manager</title>
<link rel="manifest" href="manifest.json">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, Roboto, sans-serif; background: #F1EFE8; color: #2C2C2A; }
  header { padding: 16px; background: #fff; border-bottom: 1px solid #E5E3DA; }
  header h1 { font-size: 18px; font-weight: 600; }
  .stats { display: flex; gap: 10px; padding: 12px 16px; }
  .stat { flex: 1; border-radius: 12px; padding: 10px 14px; }
  .stat.total { background: #F1EFE8; }
  .stat.important { background: #FCEBEB; }
  .stat p.label { font-size: 12px; color: #5F5E5A; }
  .stat.important p.label { color: #A32D2D; }
  .stat p.value { font-size: 22px; font-weight: 600; margin-top: 2px; }
  .stat.important p.value { color: #791F1F; }
  #list { padding: 0 16px 24px; display: flex; flex-direction: column; gap: 10px; }
  .card { border-radius: 16px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
  .card .info { min-width: 0; flex: 1; }
  .card .row { display: flex; justify-content: space-between; gap: 6px; }
  .card .name { font-size: 14px; font-weight: 600; }
  .card .time { font-size: 11px; }
  .card .cat { font-size: 12px; }
  .card .snippet { font-size: 12px; margin-top: 3px; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #detail { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: flex-end; z-index: 10; }
  #detail.open { display: flex; }
  #detail .sheet { background: #fff; width: 100%; max-height: 80vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 16px; }
  #detail .close { float: right; font-size: 20px; border: none; background: none; cursor: pointer; }
  #detail .head { border-radius: 14px; padding: 14px; margin: 8px 0 12px; display: flex; align-items: center; gap: 10px; }
  #detail .bubble { max-width: 85%; border-radius: 14px; padding: 9px 13px; font-size: 13px; margin-bottom: 8px; }
  #detail .actions { display: flex; gap: 8px; margin-top: 12px; }
  #detail button.action { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ddd; background: #fff; font-size: 13px; }
  #detail button.action.primary { background: #2C2C2A; color: #fff; border: none; }

  #empty { text-align: center; padding: 60px 20px; color: #888780; font-size: 14px; }
</style>
</head>
<body>

<header><h1>Call manager</h1></header>

<div class="stats">
  <div class="stat total"><p class="label">Today</p><p class="value" id="statTotal">0 calls</p></div>
  <div class="stat important"><p class="label">Important</p><p class="value" id="statImportant">0</p></div>
</div>

<div id="list"></div>
<div id="empty" style="display:none">No calls yet -- they'll show up here as your AI assistant handles them.</div>

<div id="detail">
  <div class="sheet">
    <button class="close" onclick="closeDetail()">&times;</button>
    <div id="detailContent"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, onSnapshot, doc, updateDoc, orderBy, query
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// TODO: replace with your Firebase project config (same project the
// backend's Firebase Admin SDK writes to -- see the backend snippet below)
// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCbqbJ7h5DNe5pBcDYKLCIrYDJPwUHbu9Y",
  authDomain: "call-manager-34d1a.firebaseapp.com",
  projectId: "call-manager-34d1a",
  storageBucket: "call-manager-34d1a.firebasestorage.app",
  messagingSenderId: "155762085177",
  appId: "1:155762085177:web:8012b9f3407448cde12ce8",
  measurementId: "G-WHLM3LFXY9"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const STYLES = {
  urgent:  { card: '#FCEBEB', text: '#791F1F', sub: '#A32D2D', avatar: '#E24B4A' },
  decline: { card: '#FAECE7', text: '#712B13', sub: '#993C1D', avatar: '#D85A30' },
  routine: { card: '#E1F5EE', text: '#085041', sub: '#0F6E56', avatar: '#1D9E75' }
};
const CATEGORY_KIND = {
  client_urgent: 'urgent', regulatory: 'urgent', unclear: 'urgent',
  database_request: 'decline', loan_pitch: 'decline',
  spam: 'routine'
};

let CALLS = []; // local mirror of Firestore, merged so we never lose local-only items on a partial snapshot

function initials(name) {
  return (name || '?').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
}

function render() {
  const listEl = document.getElementById('list');
  const emptyEl = document.getElementById('empty');
  if (CALLS.length === 0) {
    listEl.innerHTML = '';
    emptyEl.style.display = 'block';
    document.getElementById('statTotal').textContent = '0 calls';
    document.getElementById('statImportant').textContent = '0';
    return;
  }
  emptyEl.style.display = 'none';

  const sorted = [...CALLS].sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
  document.getElementById('statTotal').textContent = `${sorted.length} calls`;
  document.getElementById('statImportant').textContent = sorted.filter(c => c.important).length;

  listEl.innerHTML = sorted.map(c => {
    const kind = CATEGORY_KIND[c.category] || 'routine';
    const s = STYLES[kind];
    return `<div class="card" style="background:${s.card}" onclick="openDetail('${c.id}')">
      <div class="avatar" style="background:${s.avatar}">${initials(c.caller_name)}</div>
      <div class="info">
        <div class="row">
          <span class="name" style="color:${s.text}">${c.caller_name || c.caller || 'Unknown'}</span>
          <span class="time" style="color:${s.sub}">${formatTime(c.timestamp)}</span>
        </div>
        <span class="cat" style="color:${s.sub}">${(c.category || 'unclear').replace('_',' ')}</span>
        <p class="snippet" style="color:${s.sub}">${c.summary || ''}</p>
      </div>
    </div>`;
  }).join('');
}

function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

window.openDetail = function (id) {
  const c = CALLS.find(x => x.id === id);
  if (!c) return;
  const kind = CATEGORY_KIND[c.category] || 'routine';
  const s = STYLES[kind];
  document.getElementById('detailContent').innerHTML = `
    <div class="head" style="background:${s.card}">
      <div class="avatar" style="background:${s.avatar};width:44px;height:44px;font-size:15px">${initials(c.caller_name)}</div>
      <div>
        <p style="font-weight:600;color:${s.text}">${c.caller_name || c.caller || 'Unknown'}</p>
        <p style="font-size:12px;color:${s.sub}">${(c.category||'unclear').replace('_',' ')} &middot; ${formatTime(c.timestamp)}</p>
      </div>
    </div>
    <div>${(c.transcript || []).map(line => `<div class="bubble" style="background:#F1EFE8">${line}</div>`).join('')}</div>
    <div class="actions">
      <button class="action primary" onclick="callBack('${c.caller || ''}')">Call back</button>
      <button class="action" onclick="toggleImportant('${c.id}', ${!c.important})">${c.important ? 'Mark not important' : 'Mark important'}</button>
    </div>`;
  document.getElementById('detail').classList.add('open');
};

window.closeDetail = function () {
  document.getElementById('detail').classList.remove('open');
};

window.callBack = function (number) {
  if (number) window.location.href = `tel:${number}`;
};

window.toggleImportant = async function (id, value) {
  await updateDoc(doc(db, 'calls', id), { important: value });
  closeDetail();
};

// Real-time listener, using the merge-fix pattern from AGA Task Manager so a
// partial/empty snapshot never wipes out calls we've already rendered.
const callsQuery = query(collection(db, 'calls'), orderBy('timestamp', 'desc'));
onSnapshot(callsQuery, (snap) => {
  const fromFirestore = [];
  snap.forEach(d => fromFirestore.push({ id: d.id, ...d.data() }));

  const fbIds = new Set(fromFirestore.map(c => c.id));
  const localOnly = CALLS.filter(c => !fbIds.has(c.id) && c._localOnly);
  CALLS = [...fromFirestore, ...localOnly];

  render();
});
</script>
</body>
</html>
