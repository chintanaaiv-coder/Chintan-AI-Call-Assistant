# One-click deploy on Render: dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: chintan-server
    runtime: docker
    rootDir: server
    # Free plan for testing: sleeps after ~15 min idle and does not keep data across restarts.
    # For real calls change to:  plan: starter  and add the disk below (about $7.25/month).
    #   disk:
    #     name: chintan-data
    #     mountPath: /data
    #     sizeGB: 1
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OWNER_NAME
        value: Chintan
      - key: APP_TOKEN
        generateValue: true
      - key: EXOTEL_STREAM_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: SPEECH_PROVIDER
        value: gemini        # switch to elevenlabs later for your own cloned voice
